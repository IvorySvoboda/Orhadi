workflows:
  ios-unsigned:
    name: Orhadi IPA (sem assinatura)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest

    # Opcional: dispara sozinho ao criar uma tag tipo v1.0
    # Sem isso, você inicia na mão pelo painel.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Build sem assinatura
        script: |
          xcodebuild build \
            -project Orhadi.xcodeproj \
            -scheme Orhadi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar IPA
        script: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Orhadi.app Payload/
          zip -r Orhadi.ipa Payload

    artifacts:
      - Orhadi.ipa
