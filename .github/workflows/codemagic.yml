name: Build IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sem assinatura
        run: |
          xcodebuild build \
            -project Orhadi.xcodeproj \
            -scheme Orhadi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Orhadi.app Payload/
          zip -r Orhadi.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Orhadi-ipa
          path: Orhadi.ipa
